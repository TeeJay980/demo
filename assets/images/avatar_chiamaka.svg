<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#D1F4D1"/>
  <!-- Neck -->
  <rect x="41" y="62" width="18" height="16" rx="4" fill="#8B5E3C"/>
  <!-- Body/top -->
  <ellipse cx="50" cy="90" rx="28" ry="18" fill="#DC2626"/>
  <!-- Head -->
  <ellipse cx="50" cy="47" rx="20" ry="22" fill="#8B5E3C"/>
  <!-- Curly hair base -->
  <ellipse cx="50" cy="28" rx="22" ry="16" fill="#0D0705"/>
  <!-- Curly hair left puffs -->
  <circle cx="30" cy="36" r="9" fill="#0D0705"/>
  <circle cx="33" cy="28" r="8" fill="#0D0705"/>
  <!-- Curly hair right puffs -->
  <circle cx="70" cy="36" r="9" fill="#0D0705"/>
  <circle cx="67" cy="28" r="8" fill="#0D0705"/>
  <!-- Top curls -->
  <circle cx="42" cy="22" r="8" fill="#0D0705"/>
  <circle cx="50" cy="20" r="8" fill="#0D0705"/>
  <circle cx="58" cy="22" r="8" fill="#0D0705"/>
  <!-- Ears -->
  <ellipse cx="29" cy="49" rx="4" ry="5" fill="#8B5E3C"/>
  <ellipse cx="71" cy="49" rx="4" ry="5" fill="#8B5E3C"/>
  <!-- Eyes -->
  <ellipse cx="42" cy="45" rx="3.5" ry="4" fill="#fff"/>
  <ellipse cx="58" cy="45" rx="3.5" ry="4" fill="#fff"/>
  <circle cx="43" cy="46" r="2.5" fill="#1A0800"/>
  <circle cx="59" cy="46" r="2.5" fill="#1A0800"/>
  <circle cx="43.8" cy="45.2" r="0.8" fill="#fff"/>
  <circle cx="59.8" cy="45.2" r="0.8" fill="#fff"/>
  <!-- Eyebrows -->
  <path d="M38.5 40 Q42 38 45.5 40" stroke="#1A0800" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M54.5 40 Q58 38 61.5 40" stroke="#1A0800" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="50" cy="53" rx="3" ry="2" fill="#70482A"/>
  <path d="M47.5 52 Q50 55 52.5 52" stroke="#70482A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Big bright smile -->
  <path d="M41 58 Q50 66 59 58" stroke="#5C2E00" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M43 59.5 Q50 65 57 59.5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
