<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#FFDFBF"/>
  <!-- Neck -->
  <rect x="41" y="62" width="18" height="16" rx="4" fill="#D4A574"/>
  <!-- Body/blouse -->
  <ellipse cx="50" cy="90" rx="28" ry="18" fill="#8B5CF6"/>
  <!-- Head -->
  <ellipse cx="50" cy="46" rx="20" ry="22" fill="#D4A574"/>
  <!-- Hijab outer -->
  <ellipse cx="50" cy="35" rx="26" ry="22" fill="#6D28D9"/>
  <!-- Hijab side drape left -->
  <path d="M24 40 Q18 60 26 80 Q34 78 36 68 Q30 58 30 45 Z" fill="#6D28D9"/>
  <!-- Hijab side drape right -->
  <path d="M76 40 Q82 60 74 80 Q66 78 64 68 Q70 58 70 45 Z" fill="#6D28D9"/>
  <!-- Hijab front opening for face -->
  <ellipse cx="50" cy="47" rx="18" ry="20" fill="#D4A574"/>
  <!-- Ears -->
  <ellipse cx="30" cy="48" rx="3" ry="4" fill="#D4A574"/>
  <ellipse cx="70" cy="48" rx="3" ry="4" fill="#D4A574"/>
  <!-- Eyes -->
  <ellipse cx="42" cy="44" rx="3.5" ry="4" fill="#fff"/>
  <ellipse cx="58" cy="44" rx="3.5" ry="4" fill="#fff"/>
  <circle cx="43" cy="45" r="2.5" fill="#2D1B00"/>
  <circle cx="59" cy="45" r="2.5" fill="#2D1B00"/>
  <circle cx="43.8" cy="44.2" r="0.8" fill="#fff"/>
  <circle cx="59.8" cy="44.2" r="0.8" fill="#fff"/>
  <!-- Eyebrows -->
  <path d="M38.5 39.5 Q42 37.5 45.5 39.5" stroke="#2D1B00" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M54.5 39.5 Q58 37.5 61.5 39.5" stroke="#2D1B00" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M48 50 Q50 53 52 50" stroke="#A07050" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M43 56 Q50 62 57 56" stroke="#8B5A2B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M45 57.5 Q50 61 55 57.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
